name: Build and run
run-name: Build and run
on: [ push, pull_request ]

env:
  TEST_EPUB_URL: https://github.com/daisy/epub-accessibility-tests/releases/download/fundamental-2.0/Fundamental-Accessibility-Tests-Basic-Functionality-v2.0.0.epub

jobs:
  # The platform this fork exists for: Apple Silicon. The default install is the portable
  # torch backend; MLX is an opt-in accelerator that must also install cleanly here.
  macos-torch-default:
    runs-on: macos-14  # arm64
    # A normal run of this job is ~6 minutes. Without a timeout the default is 6 hours, so a
    # package mirror that stalls instead of failing keeps the job "in progress" all day.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg, espeak-ng
        timeout-minutes: 20
        run: brew install ffmpeg espeak-ng
      - name: Install
        run: pip install .
      - name: Check it runs as a script
        run: epubcast --help
      - name: Confirm torch is the default backend and MLX is opt-in
        run: |
          python - <<'PY'
          from epubcast.backends import mlx_available, torch_available, resolve_backend
          assert torch_available(), 'kokoro/torch should install by default'
          assert not mlx_available(), 'mlx-audio must not be pulled in by the base install'
          assert resolve_backend('auto') == 'torch'
          print('backend: torch, mlx absent - as intended')
          PY
      - name: Install the MLX accelerator and confirm it stays opt-in
        run: |
          pip install ".[mlx]"
          python - <<'PY'
          from epubcast.backends import mlx_available, resolve_backend
          assert mlx_available(), 'the [mlx] extra should make mlx available on Apple Silicon'
          assert resolve_backend('auto') == 'torch', 'auto still prefers torch when both are installed'
          print('mlx installed; auto still prefers torch - as intended')
          PY
      - name: Unit tests
        run: |
          python test/test_extract_text.py
          python test/test_split_chapters.py
          python test/test_backends.py
          python test/test_chinese.py
          python test/test_power.py
          python test/test_imports.py
          python test/test_cli.py
      - name: Download test epub
        run: curl -sSL -o book.epub "$TEST_EPUB_URL"
      - name: Create audiobook
        run: epubcast book.epub -v af_sky
      - name: Check the m4b landed in the default output folder
        run: |
          ls -lah audiobooks/book.m4b
          test -s audiobooks/book.m4b

  # The portable torch backend must work off Apple Silicon too. `[torch]` is a legacy no-op
  # alias kept so old install instructions still work; the torch engine is part of the core
  # dependency set, so a plain `pip install .` is what this job really exercises.
  linux-torch-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install espeak-ng
        timeout-minutes: 15
        run: |
          # apt now supplies only espeak-ng, a few MB. ffmpeg used to drag ~100 packages
          # and 241 MB through azure.archive.ubuntu.com, which failed three runs in a row
          # -- once stalled outright, once crawling at ~70 kB/s until the cap killed it at
          # package 59 of 100. The timeouts remain only to stop a genuine hang from burning
          # the six-hour default; they are not a performance budget.
          timeout 600 sudo apt-get -o Acquire::Retries=3 update
          timeout 600 sudo apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends espeak-ng
      - name: Install ffmpeg
        timeout-minutes: 10
        env:
          # One download from GitHub's CDN instead of ~100 from a mirror we do not choose.
          # BtbN links the ffmpeg libraries into the binaries; only glibc stays dynamic,
          # which ubuntu-latest provides.
          #
          # Pinned to a dated release and checked against its hash, because this step
          # executes a downloaded binary. BtbN prunes old autobuild tags eventually: if the
          # download ever 404s, take a newer tag from the releases page and update the tag,
          # asset name and SHA256 together.
          FFMPEG_TAG: autobuild-2026-08-19-19-21
          FFMPEG_ASSET: ffmpeg-n8.1.2-44-g7c533d0f86-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: c86e5d9a6cdd824a0b1f220ebc43c57dec129df3252376988730a091d19be4ce
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_ASSET"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          tar xf ffmpeg.tar.xz --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          sudo install -m 755 ffmpeg ffprobe /usr/local/bin/
          rm -f ffmpeg ffprobe ffmpeg.tar.xz
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
          # create_m4b needs an AAC encoder and find_aac_encoder falls back to the native
          # one, so a build without it would fail only at the last step of the run.
          ffmpeg -hide_banner -encoders | grep -qE '^\s*\S+\s+aac\s'
          echo 'native aac encoder present'
      - name: Install with the torch extra
        run: pip install ".[torch]"
      - name: Confirm the torch backend is selected off Apple Silicon
        run: |
          python - <<'PY'
          from epubcast.backends import mlx_available, torch_available, resolve_backend
          assert not mlx_available(), 'mlx must not be used off Apple Silicon'
          assert torch_available(), 'the [torch] extra should provide kokoro'
          assert resolve_backend('auto') == 'torch'
          print('backend: torch - as intended')
          PY
      - name: Unit tests
        run: |
          python test/test_extract_text.py
          python test/test_split_chapters.py
          python test/test_backends.py
          python test/test_chinese.py
          python test/test_power.py
          python test/test_imports.py
          python test/test_cli.py
      - name: Download test epub
        run: curl -sSL -o book.epub "$TEST_EPUB_URL"
      - name: Create audiobook
        run: epubcast book.epub -v af_sky --backend torch
      - name: Check the m4b landed in the default output folder
        run: |
          ls -lah audiobooks/book.m4b
          test -s audiobooks/book.m4b
